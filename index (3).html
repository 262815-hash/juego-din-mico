/* ---------- Adivina quién soy ---------- */
const QW=[
['utero','Útero','Soy un órgano muscular con forma de pera invertida.','Aquí crece el bebé durante todo el embarazo.','Mi capa interna se llama endometrio.'],
['ovulo','Óvulo','Soy la célula sexual femenina, la más grande del cuerpo.','Nazco en el ovario y salgo una vez al mes.','Si un espermatozoide me encuentra, formamos un cigoto.'],
['esperma','Espermatozoide','Soy la célula sexual masculina, diminuta y con cola.','Uso mi flagelo para nadar hacia la trompa de Falopio.','Llevo 23 cromosomas, con una X o una Y.'],
['placenta','Placenta','Solo existo durante el embarazo.','Llevo oxígeno y alimento al bebé a través de un cordón.','Salgo después del bebé, en el alumbramiento.'],
['feto','Feto','Vivo dentro de una bolsa llena de líquido.','Me llaman así desde la semana 9 de gestación.','Mi corazón late entre 110 y 160 veces por minuto.'],
['test','Prueba de embarazo','Soy un objeto pequeño con una ventanita.','Detecto una hormona en la orina.','Dos rayitas suelen significar positivo.'],
['cinta','Cinta métrica','Soy flexible y estoy llena de números.','Me usan para medir la altura uterina.','Voy del pubis hasta el fondo del útero.'],
['pinard','Estetoscopio de Pinard','Parezco una trompetita de madera o metal.','Me apoyan sobre la panza de la gestante.','Sirvo para escuchar los latidos del bebé.'],
['eco','Ecografía','Soy una imagen en tonos de gris.','Funciono con ondas de sonido, no con radiación.','Me usan para ver al bebé dentro del útero.'],
['🤱','Lactancia materna','Soy el mejor alimento del recién nacido.','Mi primera leche se llama calostro.','Se recomienda que sea exclusiva durante los primeros 6 meses.'],
['💉','Oxitocina','Soy una hormona que también se usa como medicamento.','Hago que el útero se contraiga.','Ayudo a prevenir la hemorragia posparto.'],
['🧬','Cromosomas','Vivo en el núcleo de las células.','Una célula normal tiene 46 de mí y un gameto tiene 23.','En la mujer, mi par sexual es XX.']];
function quien(){const N=8,L=sh(QW).slice(0,N),tk=T;let i=0,c=0,lv=3,sc=0;
const nx=()=>{if(i>=N||lv<=0){best('quien',sc);return endp(`<h2>🕵️ ${c}/${N} identificados</h2><p>Nota: ${Math.round(c/N*20)}/20 · ${sc} pts</p>`,quien)}
const q=L[i],op=sh([q[1],...sh(QW.filter(z=>z!=q)).slice(0,3).map(z=>z[1])]);let k=1,d=0;
const draw=()=>{$('#stage').innerHTML=`<div class="p" style="margin:auto;text-align:center"><small>🕵️ Adivina quién soy · ${i+1}/${N} · ${'❤'.repeat(lv)} · ${sc} pts</small><div class="im" style="filter:blur(${[0,18,7,0][k]}px);transition:filter .6s">${img(q[0],170)}</div><div style="text-align:left;color:var(--m)">${q.slice(2,2+k).map((z,j)=>`<p>🔎 <b>Pista ${j+1}:</b> ${z}</p>`).join('')}</div><div class="o">${op.map(x=>`<button class="b">${x}</button>`).join('')}</div>${k<3?'<button class="b" id="pi" style="text-align:center">💡 Otra pista (menos puntos)</button>':''}</div>`;
const pi=$('#pi');if(pi)pi.onclick=()=>{k++;draw()};
document.querySelectorAll('.o .b').forEach(b=>b.onclick=()=>{if(d)return;d=1;const g=b.textContent==q[1],pt=[0,30,20,10][k];document.querySelectorAll('.o .b').forEach(x=>{x.disabled=1;if(x.textContent==q[1])x.classList.add('g')});$('.im').style.filter='none';if(pi)pi.style.display='none';if(g){c++;sc+=pt;add(pt);ok()}else{b.classList.add('r');lv--;ko()}setTimeout(()=>{if(tk!=T)return;i++;nx()},1500)})};
draw()};nx()}

/* ---------- ¿Qué cambió? ---------- */
const PO=['🩺','💉','🍼','🧸','🌡️','💊','🩸','🧬','🔬','🩹','🧪','👶','🤰','🤱','🏥','🚑','IM:utero','IM:ovulo','IM:placenta','IM:test','IM:cinta','IM:pinard','IM:eco','IM:esperma'];
function cam(n=1){const tk=T,cl=[3,3,4,4][n-1],rw=[2,3,3,4][n-1],N=5,TS=Math.max(3,Math.round([6,7,8,9][n-1]/D()));let r=0,c=0;
const cell=v=>v?(v.startsWith('IM:')?img(v.slice(3),56):`<span style="font-size:clamp(24px,7vw,42px)">${v}</span>`):'';
const grid=(a,f)=>`<div class="cg" style="grid-template-columns:repeat(${cl},1fr)">${a.map((v,i)=>`<button class="b cl2" data-i="${i}">${f?f(v):cell(v)}</button>`).join('')}</div>`;
const rnd=()=>{if(r>=N){const p=c>=4;best('cam',c*10+n);return endp(`<h2>🔍 Nivel ${n}/4 · ${c}/${N} aciertos</h2><p>Nota: ${Math.round(c/N*20)}/20</p>${p||n>=4?'':'<p>Necesitas 4 aciertos para subir de nivel</p>'}`,p&&n<4?()=>cam(n+1):()=>cam(n),p&&n<4?'Siguiente nivel ▶':'Reintentar')}
const sz=cl*rw,A=sh(PO).slice(0,sz),Bg=[...A],ty=R(0,2),i=R(0,sz-1);let ch=[i],ex='',t=TS,dn=0;
if(ty==0){const w=sh(PO.filter(z=>!A.includes(z)))[0];Bg[i]=w;ex=`${mini(A[i])} cambió por ${mini(w)}`}
else if(ty==1){Bg[i]='';ex=`${mini(A[i])} desapareció`}
else{let j;do{j=R(0,sz-1)}while(j==i);Bg[i]=A[j];Bg[j]=A[i];ch=[i,j];ex=`${mini(A[i])} y ${mini(A[j])} intercambiaron de lugar`}
const hd=m=>`<small>🔍 Nivel ${n}/4 · Ronda ${r+1}/${N} · ✔ ${c}</small><h3>${m}</h3>`;
const find=()=>{if(tk!=T)return;$('#stage').innerHTML=`<div class="p" style="margin:auto;text-align:center">${hd('¿Qué cambió? Toca el cambio')}${grid(Bg)}<div id="ex"></div></div>`;
document.querySelectorAll('.cl2').forEach(b=>b.onclick=()=>{if(dn)return;dn=1;const k=+b.dataset.i,g=ch.includes(k);if(g){c++;add(20);ok()}else ko();document.querySelectorAll('.cl2').forEach((x,ix)=>{if(ch.includes(ix))x.classList.add('g')});if(!g)b.classList.add('r');$('#ex').innerHTML=(g?'✅ ':'❌ ')+'Cambio: '+ex;setTimeout(()=>{if(tk!=T)return;r++;rnd()},2200)})};
const blank=()=>{if(tk!=T)return;$('#stage').innerHTML=`<div class="p" style="margin:auto;text-align:center">${hd('😌 Ahora…')}${grid(A,()=>'✨')}</div>`;setTimeout(find,1200)};
const show=()=>{if(tk!=T)return;if(t<=0)return blank();$('#stage').innerHTML=`<div class="p" style="margin:auto;text-align:center">${hd('👀 Memoriza: '+t)}${grid(A)}</div>`;t--;setTimeout(show,1000)};show()};rnd()}

const MV=[
['Las embarazadas deben comer por dos.',0,'Necesitan comer mejor, no el doble: solo unas 300 a 450 kcal extra en el segundo y tercer trimestre.','🍽️'],

['Todas las gestantes pueden viajar en avión sin ninguna restricción en cualquier semana.',0,'Muchas aerolíneas ponen límites cerca del final del embarazo; lo ideal es consultar al personal de salud.','✈️']];
function mito(n=1){const N=[6,8,10][n-1],L=sh(MV).slice(0,N),TL=[18,14,11][n-1];let i=0,c=0,st=0,sc=0;
const nx=()=>{clearInterval(qt);if(i>=N){best('mito',sc);const p=c/N>=.7;return endp(`<h2>Nota: ${Math.round(c/N*20)}/20 ${c==N?'🏆':''}</h2><p>${c}/${N} correctas · ${sc} pts</p>${p||n>=3?'':'<p>Necesitas 70% para subir de nivel</p>'}`,p&&n<3?()=>mito(n+1):()=>mito(n),p&&n<3?'Siguiente nivel ▶':'Reintentar')}
const q=L[i];let t=TL,d=0;
$('#stage').innerHTML=`<div class="p" style="margin:auto;text-align:center"><small>🧐 Nivel ${n}/3 · ${i+1}/${N} · 🔥${st} · ⏱ <b id="mt">${t}</b>s · ${sc} pts</small><div class="im">${img(q[3],140)}</div><h3>${q[0]}</h3><div class="row" style="justify-content:center"><button class="b tfb" data-v="1" style="flex:1;text-align:center;background:linear-gradient(135deg,#065f46,#047857)">✅ ES VERDAD</button><button class="b tfb" data-v="0" style="flex:1;text-align:center;background:linear-gradient(135deg,#9f1239,#be123c)">❌ ES MENTIRA</button></div><div id="ex"></div></div>`;
const fin=v=>{if(d)return;d=1;clearInterval(qt);const g=v==(q[1]?1:0);document.querySelectorAll('.tfb').forEach(x=>x.disabled=1);if(g){c++;st++;const p=10+Math.min(st,5)*3+Math.ceil(t/3);sc+=p;add(p);ok()}else{st=0;ko()}
$('#ex').innerHTML=`<h3 style="color:${q[1]?'#4ade80':'#f87171'}">${q[1]?'✅ REALIDAD':'❌ MITO'} ${g?'· ¡Correcto!':v<0?'· ¡Se acabó el tiempo!':'· Incorrecto'}</h3><p>${q[2]}</p><button class="b" id="sig" style="text-align:center">Siguiente ▶</button>`;$('#sig').onclick=()=>{i++;nx()}};
document.querySelectorAll('.tfb').forEach(b=>b.onclick=()=>fin(+b.dataset.v));
qt=setInterval(()=>{if(d)return;t--;const e=$('#mt');if(e)e.textContent=t;if(t<=0)fin(-1)},1000)};nx()}

/* ---------- Rompecabezas ---------- */
function puz(n=1){const k=[2,3,4][n-1],N=k*k,key=['utero','ovulo','placenta'][n-1];
const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><defs><radialGradient id="zb" cx=".5" cy=".45" r=".8"><stop offset="0" stop-color="#312e81"/><stop offset="1" stop-color="#050a24"/></radialGradient></defs><rect width="200" height="200" fill="url(#zb)"/><g fill="#a5f3fc" opacity=".7"><circle cx="18" cy="24" r="1.6"/><circle cx="170" cy="30" r="1.2"/><circle cx="30" cy="172" r="1.4"/><circle cx="176" cy="174" r="1.8"/><circle cx="150" cy="12" r="1"/><circle cx="12" cy="110" r="1.2"/></g>${IM[key]}</svg>`;
const U='url("data:image/svg+xml,'+encodeURIComponent(svg)+'")';
const od=sh([...Array(N).keys()]);const ul=new Set,pl=new Set;let sel=-1,bad=0;
const ps=(e,i)=>{e.style.backgroundImage=U;e.style.backgroundSize=`${k*100}% ${k*100}%`;e.style.backgroundPosition=`${(i%k)/(k-1)*100}% ${Math.floor(i/k)/(k-1)*100}%`};
const draw=()=>{$('#stage').innerHTML=`<div class="p" style="margin:auto;text-align:center"><small>🧩 Rompecabezas · Nivel ${n}/3 · ${pl.size}/${N} piezas · errores ${bad}</small><div class="row" style="justify-content:center;align-items:center"><div class="pb" style="grid-template-columns:repeat(${k},1fr)">${[...Array(N).keys()].map(i=>`<div class="sl2${pl.has(i)?' ok':''}" data-s="${i}"></div>`).join('')}</div><div><small>Imagen guía</small><div class="gd"></div></div></div><p>${sel>=0?'👆 Toca el lugar donde va la pieza':'Toca una pieza 🔒, responde la pregunta y gana la pieza'}</p><div class="tr">${od.filter(i=>!pl.has(i)).map(i=>`<div class="pc${ul.has(i)?' un':''}${sel==i?' sel':''}" data-p="${i}">${ul.has(i)?'':'🔒'}</div>`).join('')}</div></div>`;
document.querySelector('.gd').style.backgroundImage=U;
document.querySelectorAll('.sl2').forEach(e=>{const i=+e.dataset.s;if(pl.has(i))ps(e,i);e.onclick=()=>{if(sel<0||pl.has(i))return;if(sel==i){pl.add(i);ul.delete(i);sel=-1;ok();add(10);draw();if(pl.size==N)setTimeout(()=>{if(tk!=T)return;const nt=Math.max(8,20-bad);best('puz',nt);endp(`<h2>🖼️ ¡Rompecabezas completo!</h2><p>Errores: ${bad} · Nota: ${nt}/20</p>`,n<3?()=>puz(n+1):()=>puz(1),n<3?'Siguiente nivel ▶':'Jugar otra vez')},1300)}else{ko();bad++;sel=-1;draw()}}});
document.querySelectorAll('.pc').forEach(e=>{const i=+e.dataset.p;if(ul.has(i))ps(e,i);e.onclick=()=>{if(ul.has(i)){sel=sel==i?-1:i;draw()}else ask(nq(),r=>{if(tk!=T)return;if(r){ul.add(i);sel=i}else bad++;draw()},'🧩 Responde para ganar la pieza')}})};
const tk=T;draw()}
const HU=[190,310,265,205,330,170,285,215,320,180,295,235];
const GAMES=[['quiz','⚡','Quiz y Guardia Obstétrica','5 niveles · teoría y casos · 50/50',quiz],['quien','🕵️','Adivina quién soy','Imágenes y pistas · 8 rondas',quien],['cam','🔍','¿Qué cambió?','4 niveles · memoria visual',cam],['acer','🧩','Acertijos','3 niveles · con imágenes',acer],['mito','🧐','Mitos y realidades','¿Verdad o mentira? · 3 niveles',mito],['puz','🖼️','Rompecabezas','Gana cada pieza respondiendo',puz],['amb','🚑','Ambulancia','5 niveles · lleva 10 gestantes',amb],['esp','🧬','Fecundación','5 niveles · nada hasta el óvulo',esp],['sopa','🔤','Sopa de Letras','4 niveles · diagonales e invertidas',sopa],['ord','🔢','Ordena el Proceso','4 niveles · ordena etapas',ord],['mem','🃏','Memoria','4 niveles · encuentra la pareja',mem],['hos','🏥','Encuentra a la gestante','8 niveles · búscala en el hospital',hos]];

function menu(){stop();music();$('#back').style.display='none';$('#stage').innerHTML='<div style="text-align:center;margin:4px">Dificultad: <span class="dfs" style="justify-content:center">'+['🟢 Básico','🟡 Medio','🟠 Difícil','🔴 Experto'].map((d,i)=>`<button class="b${i+1==DF?' on':''}" data-d="${i+1}">${d}</button>`).join('')+'</span></div><div id="menu">'+GAMES.map(g=>`<div class="card" data-g="${g[0]}" style="background:linear-gradient(150deg,hsla(${HU[GAMES.indexOf(g)]},90%,24%,.95),#060a22);border:1px solid hsl(${HU[GAMES.indexOf(g)]},100%,62%);box-shadow:0 0 18px hsla(${HU[GAMES.indexOf(g)]},100%,60%,.5)"><i>${g[1]}</i><b>${g[2]}</b><br><small>${g[3]}</small><br><small>🏆 ${S.b[g[0]]||0}</small></div>`).join('')+'</div><div style="text-align:center;margin:18px 0 6px;font-size:12px;color:var(--m)">UNIVERSIDAD NACIONAL DE SAN ANTONIO ABAD DEL CUSCO<br><b>MARICRUZ JIMENA CASTILLO YUPANQUI</b></div>';
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{DF=+b.dataset.d;menu()});document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{stop();$('#back').style.display='';GAMES.find(g=>g[0]==c.dataset.g)[4]()})}
$('#back').onclick=menu;login();
</script></body></html>
